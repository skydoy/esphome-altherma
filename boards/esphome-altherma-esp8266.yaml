substitutions:
  altherma_board: esp8266
  altherma_verify_ssl: "false"

packages:
  base: !include base.yaml
  update_check: !include ../installer/packages/update-check.yaml

esp8266:
  board: d1_mini

uart:
  id: uart_bus
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
