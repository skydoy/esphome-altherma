substitutions:
  altherma_board: esp32-s3

packages:
  base: !include base.yaml
  update_check: !include ../installer/packages/update-check.yaml

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: GPIO1
  rx_pin: GPIO2
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1