# Mapping for Daikin Altherma 3 - ERLA D EBV-EBB-EBVZ D SERIES 11-16kW

# Âncoras base
.altherma_base: &altherma_base
  platform: altherma_hub
  altherma_hub_id: altherma_hub_1

.temp: &temp
  <<: *altherma_base
  device_class: temperature
  unit_of_measurement: "°C"
  state_class: measurement
  accuracy_decimals: 1

.pressure: &pressure
  <<: *altherma_base
  device_class: pressure
  unit_of_measurement: "bar"
  state_class: measurement
  accuracy_decimals: 2

.freq: &freq
  <<: *altherma_base
  unit_of_measurement: "rps"
  state_class: measurement
  accuracy_decimals: 0

.current: &current
  <<: *altherma_base
  device_class: current
  unit_of_measurement: "A"
  state_class: measurement
  accuracy_decimals: 1

.binary: &binary
  <<: *altherma_base

.text: &text
  <<: *altherma_base

# Sensores Numéricos
sensor:
  # --- Temperaturas Exteriores e Circuito Frigorigéneo (0x20) ---
  - <<: *temp
    id: altherma_outdoor_temp
    name: "Outdoor Air Temp (R1T)"
    register: 0x20
    offset: 0
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Outdoor Heat Exchanger Temp (R4T)"
    register: 0x20
    offset: 2
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Discharge Pipe Temp (R2T)"
    register: 0x20
    offset: 4
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Suction Pipe Temp (R3T)"
    register: 0x20
    offset: 6
    convid: 105
    datasize: 2

  - <<: *pressure
    name: "High Pressure"
    register: 0x20
    offset: 12
    convid: 105
    datasize: 2

  - <<: *pressure
    name: "Low Pressure"
    register: 0x20
    offset: 14
    convid: 105
    datasize: 2

  # --- Elétrica e Compressor (0x21, 0x30) ---
  - <<: *current
    id: altherma_inv_current
    name: "INV Primary Current"
    register: 0x21
    offset: 0
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Inverter Fin Temp"
    register: 0x21
    offset: 4
    convid: 105
    datasize: 2

  - <<: *freq
    id: altherma_comp_freq
    name: "Compressor Frequency"
    register: 0x30
    offset: 0
    convid: 152
    datasize: 1

  # --- Circuito Hidráulico Interior (0x60, 0x61, 0x62) ---
  - <<: *temp
    name: "Leaving Water Temp before BUH (R1T)"
    register: 0x61
    offset: 2
    convid: 105
    datasize: 2

  - <<: *temp
    id: altherma_lwt
    name: "Leaving Water Temp after BUH (R2T)"
    register: 0x61
    offset: 4
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Refrig Temp Liquid Side (R3T)"
    register: 0x61
    offset: 6
    convid: 105
    datasize: 2

  - <<: *temp
    id: altherma_return
    name: "Inlet Water Temp (R4T)"
    register: 0x61
    offset: 8
    convid: 105
    datasize: 2

  - <<: *temp
    id: altherma_dhw_temp
    name: "DHW Tank Temp (R5T)"
    register: 0x61
    offset: 10
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Indoor Ambient Temp (R1T)"
    register: 0x61
    offset: 12
    convid: 105
    datasize: 2

  - <<: *altherma_base
    id: altherma_flow
    name: "Flow Sensor"
    register: 0x62
    offset: 9
    convid: 105
    datasize: 2
    unit_of_measurement: "l/min"
    state_class: measurement
    accuracy_decimals: 1

  - <<: *pressure
    name: "Water Pressure"
    register: 0x62
    offset: 11
    convid: 105
    datasize: 1

  - <<: *temp
    name: "DHW Setpoint"
    register: 0x60
    offset: 7
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Leaving Water Setpoint Main"
    register: 0x60
    offset: 9
    convid: 105
    datasize: 2

  - <<: *temp
    name: "Heat Exchanger Mid Temp (R5T)"
    register: 0x20
    offset: 8
    convid: 105
    datasize: 2

  # Confirmed on this unit while heating (discovery 2026-11-05): 0x10/8 conv114.
  - <<: *temp
    id: altherma_target_cond
    name: "Target Cond. Temp."
    register: 0x10
    offset: 8
    convid: 114
    datasize: 2

  - <<: *altherma_base
    name: "Expansion Valve 1"
    unit_of_measurement: "pls"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:valve
    register: 0x30
    offset: 3
    convid: 151
    datasize: 2

  - <<: *altherma_base
    name: "Outdoor Fan Step"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:fan
    register: 0x30
    offset: 1
    convid: 211
    datasize: 1

  - <<: *altherma_base
    name: "Water Pump Signal"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:pump
    # 0 = maximum speed, 100 = stopped
    register: 0x62
    offset: 12
    convid: 152
    datasize: 1

  - <<: *altherma_base
    name: "Indoor Error Detail Code"
    entity_category: diagnostic
    accuracy_decimals: 0
    icon: mdi:alert-circle-outline
    register: 0x60
    offset: 4
    convid: 152
    datasize: 1

# Sensores Binários
binary_sensor:
  - <<: *binary
    id: altherma_defrost
    name: "Defrost Operation"
    register: 0x10
    offset: 1
    convid: 304
    datasize: 1

  - <<: *binary
    name: "Thermostat Status"
    register: 0x10
    offset: 1
    convid: 307
    datasize: 1

  - <<: *binary
    name: "Water Pump Operation"
    register: 0x60
    offset: 12
    convid: 301
    datasize: 1

  - <<: *binary
    id: altherma_valve_dhw
    name: "3-Way Valve (DHW/Space)"
    register: 0x60
    offset: 12
    convid: 306
    datasize: 1

  - <<: *binary
    name: "Backup Heater Step 1"
    register: 0x60
    offset: 12
    convid: 304
    datasize: 1

  - <<: *binary
    name: "Backup Heater Step 2"
    register: 0x60
    offset: 12
    convid: 303
    datasize: 1

  - <<: *binary
    name: "Space Heating Operation"
    register: 0x62
    offset: 2
    convid: 303
    datasize: 1

  - <<: *binary
    name: "Powerful DHW Operation"
    register: 0x62
    offset: 2
    convid: 304
    datasize: 1

  - <<: *binary
    name: "Space Heating Output"
    register: 0x62
    offset: 8
    convid: 300
    datasize: 1

  - <<: *binary
    name: "Silent Mode"
    register: 0x60
    offset: 2
    convid: 301
    datasize: 1

  - <<: *binary
    name: "Water Flow Switch"
    register: 0x60
    offset: 11
    convid: 307
    datasize: 1

  - <<: *binary
    name: "4-Way Valve"
    register: 0x30
    offset: 11
    convid: 307
    datasize: 1

# Sensores de Texto / Estados
text_sensor:
  - <<: *text
    name: "Operation Mode"
    icon: mdi:heat-pump
    register: 0x10
    offset: 0
    convid: 217
    datasize: 1
    # On ERLA D, value 0 of this register means the unit is stopped, not "Fan Only"
    # (the shared label table in converters.h is left unchanged for the other models).
    filters:
      - substitute:
          - "Fan Only -> Stopped"

  - <<: *text
    name: "Indoor Unit Operation Mode"
    icon: mdi:heat-pump
    register: 0x60
    offset: 2
    convid: 315
    datasize: 1

  - <<: *text
    id: altherma_outdoor_error
    name: "Outdoor Error Code"
    icon: mdi:alert-circle-outline
    register: 0x10
    offset: 5
    convid: 204
    datasize: 1

  - <<: *text
    id: altherma_indoor_error
    name: "Indoor Error Code"
    icon: mdi:alert-circle-outline
    register: 0x60
    offset: 3
    convid: 204
    datasize: 1

  - <<: *text
    name: "Indoor Error Type"
    icon: mdi:alert-circle-outline
    register: 0x60
    offset: 5
    convid: 203
    datasize: 1

# Derived COP / energy / compressor / defrost / error description (needs the ids above).
packages:
  erla_performance: !include ../installer/packages/performance.yaml
