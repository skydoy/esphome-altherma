# Web installer build for skydoy/esphome-altherma (board: M5Stack Core / Basic).
# Same idea as the other installer/*.installer.yaml files, built on
# ../boards/esphome-altherma-m5stack.yaml (screen UI and buttons, left untouched) plus the optional
# boot animation package. That file is a personal config using !secret for Wi-Fi
# and the OTA password; this wrapper drops the Wi-Fi credentials (set via Improv / hotspot
# instead); installer/secrets.yaml supplies empty placeholders because !secret is resolved at load time.
# CI (.github/workflows/publish.yml) rewrites altherma_model and altherma_version per build.
substitutions:
  altherma_model: generic
  altherma_version: dev
  altherma_board: m5stack
  altherma_component_source: ../components

packages:
  board: !include ../boards/esphome-altherma-m5stack.yaml
  identify: !include packages/identify.yaml
  firmware_update: !include packages/firmware-update.yaml
  webui: !include packages/webui.yaml
  # Optional: animated ESPHome Altherma splash at boot. Remove this line to disable.
  boot_animation: !include packages/boot-animation-m5stack.yaml

esphome:
  name: esphome-altherma
  name_add_mac_suffix: true
  project:
    name: skydoy.esphome-altherma
    version: ${altherma_version}

wifi:
  ssid: !remove
  password: !remove
  ap:

dashboard_import:
  package_import_url: github://skydoy/esphome-altherma/boards/esphome-altherma-m5stack.yaml@main

improv_serial:

http_request:

ota:
  - platform: http_request
    id: ota_http
    on_begin:
      - text_sensor.template.publish:
          id: update_status
          state: "Downloading firmware (do not unplug)"
      - logger.log: "Firmware update download started (do not unplug)"
    on_end:
      - text_sensor.template.publish:
          id: update_status
          state: "Installed, rebooting"
      - logger.log: "Firmware update installed, rebooting"
    on_error:
      - text_sensor.template.publish:
          id: update_status
          state: !lambda 'return "Update failed (" + to_string(x) + ")";'
      - logger.log:
          level: WARN
          format: "Firmware update failed (error %u), still running the old firmware"
          args: [x]

update:
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    device_class: firmware
    entity_category: config
    update_interval: 6h
    on_update_available:
      - text_sensor.template.publish:
          id: update_status
          state: !lambda 'return "Update available: " + x.latest_version;'
    source: https://skydoy.github.io/esphome-altherma/firmware/${altherma_board}/${altherma_model}/manifest.json
