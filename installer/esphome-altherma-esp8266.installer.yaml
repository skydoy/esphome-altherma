# Web installer build for skydoy/esphome-altherma (board: esp8266).
# Same as ../boards/esphome-altherma-esp8266.factory.yaml,
# plus what the web installer needs: the heat pump model ("generic" = identify first, see installer/models.yaml), this project's
# project name/version and a per-board, per-model OTA manifest URL.
# CI (.github/workflows/publish.yml) rewrites altherma_model and altherma_version per build.
substitutions:
  altherma_model: generic
  altherma_version: dev
  altherma_board: esp8266
  # Build the component from this checkout (path is relative to installer/).
  altherma_component_source: ../components

packages:
  board: !include ../boards/esphome-altherma-esp8266.yaml
  identify: !include packages/identify.yaml
  firmware_update: !include packages/firmware-update.yaml
  webui: !include packages/webui.yaml

esphome:
  project:
    name: skydoy.esphome-altherma
    version: ${altherma_version}

# Adopting in the ESPHome Device Builder imports the plain board file from skydoy/esphome-altherma.
# Add "altherma_model: <model>" under substitutions in the adopted YAML to keep your model.
dashboard_import:
  package_import_url: github://skydoy/esphome-altherma/boards/esphome-altherma-esp8266.yaml@main

# Wi-Fi provisioning over USB from the web installer.
improv_serial:

# OTA updates from skydoy/esphome-altherma GitHub Pages (same board and model you installed).
http_request:
  verify_ssl: false

ota:
  - platform: http_request
    id: ota_http
    on_begin:
      - text_sensor.template.publish:
          id: update_status
          state: "Downloading firmware (do not unplug)"
      - logger.log: "Firmware update download started (do not unplug)"
    on_end:
      - text_sensor.template.publish:
          id: update_status
          state: "Installed, rebooting"
      - logger.log: "Firmware update installed, rebooting"
    on_error:
      - text_sensor.template.publish:
          id: update_status
          state: !lambda 'return "Update failed (" + to_string(x) + ")";'
      - logger.log:
          level: WARN
          format: "Firmware update failed (error %u), still running the old firmware"
          args: [x]

update:
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    device_class: firmware
    entity_category: config
    update_interval: 6h
    on_update_available:
      - text_sensor.template.publish:
          id: update_status
          state: !lambda 'return "Update available: " + x.latest_version;'
    source: https://skydoy.github.io/esphome-altherma/firmware/${altherma_board}/${altherma_model}/manifest.json
